<!doctype html>
<!-- HORIZON's face in the plugin window: the night sky over Steve's mountains (THE SKY, from Mixtape 2's HORIZON), and on clear glass
     the name, the PEDAL and KEYS IN lights, a little screen, and the knobs LEVEL, HALL, RELEASE, each joined to the plugin's own
     parameter (face.js). Opened straight in a browser (no plugin round it) it runs on its own, so it can be tried and drawn. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HORIZON</title>
<link rel="stylesheet" href="face.css">
</head>
<body>
<div class="hz">
  <canvas class="sky"></canvas>
  <div class="ui">
    <div class="credit glass">Piano: Salamander Grand by Alexander Holm (CC BY 3.0)</div>
    <div class="bar glass">
      <span class="word">HORIZON</span>
      <span class="dots"><span class="dot"><i data-l="pedal"></i>PEDAL</span><span class="dot"><i data-l="kin"></i>KEYS IN</span></span>
      <span class="sep"></span>
      <span class="lcd"><b>SALAMANDER GRAND</b><span>TUNING...</span></span>
      <span class="sep"></span>
      <div class="kn" data-k="level" style="--c:#FFB27A" title="LEVEL: how loud HORIZON plays (drag up and down, or scroll; double-click for 0 dB)"><div class="cap"><i></i></div><b>LEVEL</b><em></em></div>
      <div class="kn" data-k="hall" style="--c:#7AB8FF" title="HALL: how much of the sound goes into the reverb (double-click for 30%)"><div class="cap"><i></i></div><b>HALL</b><em></em></div>
      <div class="kn" data-k="release" style="--c:#C29BFF" title="RELEASE: how long a key you let go takes to die away (double-click for 350 ms)"><div class="cap"><i></i></div><b>RELEASE</b><em></em></div>
    </div>
  </div>
</div>
<script src="picture.js"></script>
<script src="sky.js"></script>
<script type="module" src="face.js"></script>
</body>
</html>
